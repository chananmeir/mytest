{% extends "base.html" %}

{% block title %}Saved Games - Family Dynamics RPG{% endblock %}

{% block content %}
<style>
    body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 40px 20px;
    }

    .header {
        text-align: center;
        color: white;
        margin-bottom: 40px;
    }

    .header h1 {
        font-size: 3em;
        margin-bottom: 10px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header p {
        font-size: 1.2em;
        opacity: 0.9;
    }

    .no-games {
        background: white;
        border-radius: 15px;
        padding: 60px 40px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .no-games h2 {
        color: #667eea;
        margin-bottom: 20px;
    }

    .no-games p {
        color: #666;
        margin-bottom: 30px;
        font-size: 1.1em;
    }

    .save-card {
        background: white;
        border-radius: 15px;
        padding: 30px;
        margin-bottom: 30px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .save-card:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 40px rgba(0,0,0,0.3);
    }

    .save-header {
        border-bottom: 2px solid #667eea;
        padding-bottom: 15px;
        margin-bottom: 20px;
    }

    .save-header h2 {
        color: #667eea;
        margin: 0 0 10px 0;
        font-size: 1.8em;
    }

    .save-meta {
        color: #888;
        font-size: 0.9em;
    }

    .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin-bottom: 25px;
    }

    .stat-box {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 10px;
        text-align: center;
    }

    .stat-label {
        font-size: 0.9em;
        opacity: 0.9;
        margin-bottom: 5px;
    }

    .stat-value {
        font-size: 2em;
        font-weight: bold;
    }

    .characters-section {
        margin-top: 25px;
    }

    .characters-section h3 {
        color: #667eea;
        margin-bottom: 15px;
        font-size: 1.3em;
    }

    .character-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
        gap: 15px;
    }

    .character-card {
        background: #f8f9fa;
        border-left: 4px solid #667eea;
        padding: 15px;
        border-radius: 8px;
    }

    .character-name {
        font-weight: bold;
        color: #333;
        margin-bottom: 8px;
        font-size: 1.1em;
    }

    .rapport-bar {
        background: #e0e0e0;
        height: 20px;
        border-radius: 10px;
        overflow: hidden;
        margin: 10px 0;
    }

    .rapport-fill {
        background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
        height: 100%;
        transition: width 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 0.8em;
        font-weight: bold;
    }

    .character-info {
        font-size: 0.9em;
        color: #666;
    }

    .character-info span {
        display: inline-block;
        margin-right: 15px;
    }

    .btn {
        display: inline-block;
        padding: 12px 30px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        text-decoration: none;
        border-radius: 25px;
        font-weight: bold;
        transition: transform 0.3s ease;
        border: none;
        cursor: pointer;
    }

    .btn:hover {
        transform: scale(1.05);
    }

    .loading {
        text-align: center;
        padding: 60px;
        color: white;
        font-size: 1.5em;
    }

    .back-link {
        text-align: center;
        margin-top: 30px;
    }
</style>

<div class="container">
    <div class="header">
        <h1>📊 Your Ongoing Games</h1>
        <p>Continue your journey or start fresh</p>
    </div>

    <div id="loading" class="loading">
        <div>Loading saved games...</div>
    </div>

    <div id="games-container"></div>

    <div class="back-link">
        <a href="/" class="btn">← Back to Main Menu</a>
    </div>
</div>

<script>
async function loadSavedGames() {
    try {
        const response = await fetch('/api/saved-games');
        const data = await response.json();

        const loading = document.getElementById('loading');
        const container = document.getElementById('games-container');

        loading.style.display = 'none';

        if (!data.success || data.count === 0) {
            container.innerHTML = `
                <div class="no-games">
                    <h2>No Saved Games Found</h2>
                    <p>You haven't saved any games yet. Start a new game to begin your adventure!</p>
                    <a href="/" class="btn">Start New Game</a>
                </div>
            `;
            return;
        }

        let html = '';

        for (const game of data.games) {
            html += `
                <div class="save-card">
                    <div class="save-header">
                        <h2>💾 ${game.file_name}</h2>
                        <div class="save-meta">
                            Last played: ${game.last_modified_display} •
                            Game time: ${game.game_time}
                        </div>
                    </div>

                    <div class="stats-grid">
                        <div class="stat-box">
                            <div class="stat-label">Suggestion Points</div>
                            <div class="stat-value">${game.player.sp}</div>
                            <div class="stat-label">Total: ${game.player.total_sp}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Money</div>
                            <div class="stat-value">$${game.player.money}</div>
                            <div class="stat-label">Total: $${game.player.total_money}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Techniques Unlocked</div>
                            <div class="stat-value">${game.player.techniques_unlocked}</div>
                        </div>
                        <div class="stat-box">
                            <div class="stat-label">Current Location</div>
                            <div class="stat-value" style="font-size: 1.2em;">📍</div>
                            <div class="stat-label">${game.player.location.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</div>
                        </div>
                    </div>

                    <div class="characters-section">
                        <h3>Character Relationships (${game.characters.length})</h3>
                        <div class="character-grid">
            `;

            for (const char of game.characters) {
                const rapportPercent = (char.rapport / 20) * 100;
                html += `
                    <div class="character-card">
                        <div class="character-name">${char.name}</div>
                        <div class="rapport-bar">
                            <div class="rapport-fill" style="width: ${rapportPercent}%">
                                ${char.rapport}/20
                            </div>
                        </div>
                        <div class="character-info">
                            <span>State: ${char.emotional_state}</span>
                            ${char.active_phs > 0 ? `<span>PHS: ${char.active_phs}</span>` : ''}
                        </div>
                    </div>
                `;
            }

            html += `
                        </div>
                    </div>
                </div>
            `;
        }

        container.innerHTML = html;

    } catch (error) {
        console.error('Error loading saved games:', error);
        document.getElementById('loading').innerHTML = `
            <div class="no-games">
                <h2>Error Loading Games</h2>
                <p>Something went wrong while loading your saved games.</p>
                <p style="color: #999; font-size: 0.9em;">${error.message}</p>
            </div>
        `;
    }
}

// Load games when page loads
loadSavedGames();
</script>
{% endblock %}
